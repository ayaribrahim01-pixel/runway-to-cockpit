# Channel-wide settings. Change here once; every future episode follows.
channel:
  name: "Runway To Cockpit"
  handle: "@runwaytocockpit"
  youtube_channel_id: UCqA3vIAcB_DJ7IHuboSL1sw   # uploads are refused if the key is for any other channel
  language: en
publish:
  time_ist: "10:15"   # daily go-live time (India Standard Time)
  youtube_privacy: public
  youtube_category: 27        # Education
voice:
  engine: kokoro
  # M4 blend chosen by the channel owner: 50% am_michael + 50% am_fenrir
  mix: {am_michael: 0.5, am_fenrir: 0.5}
  speed: 1.18                 # ~150 words/min, natural conversational pace
  sentence_pause: 0.34
  clause_pause: 0.12
  paragraph_pause: 0.6
  jitter: 0.02
brand:
  mode: light                 # light theme chosen by the channel owner (white + orange + navy)
  bg: "#F8F5EF"               # warm off-white background
  bg2: "#FFFFFF"
  card: "#FFFFFF"             # cards and panels
  ink: "#10213A"              # deep navy text
  muted: "#5D6B80"
  accent: "#EE6A1A"           # orange: highlights, keywords, progress
  onAccent: "#FFFFFF"
  sky: "#1F6FB2"              # aviation blue: lines, diagrams, icons
  good: "#15803D"
  warn: "#D9363E"
  ocean: "#EAF2FB"            # globe water
  land: "#2B5C9A"             # globe land dots
