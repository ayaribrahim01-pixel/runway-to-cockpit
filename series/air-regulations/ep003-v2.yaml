# Air Regulations · Episode 3 (v2 style) — Freedoms of the Air
# Narration markup: {{n}} = visual cue, [[pause s]] = silence, {shown|spoken}, *word* = emphasis.

series: air-regulations
series_name: Air Regulations
series_short: Air Regs
code: AR-003
episode: 3
style: v2
title: Freedoms of the Air
subtitle: "All nine, the two Chicago agreements, and India's open-skies rule"
intro_chapter: Why some flights are allowed and others aren't
playlist: Air Regulations — DGCA CPL/ATPL
next:
  title: "Air Law Conventions You Must Know"

sources:
  - "International Air Services Transit Agreement and International Air Transport Agreement, Chicago, 7 December 1944"
  - "ICAO Manual on the Regulation of International Air Transport (Doc 9626): freedoms 6–9 described as 'so-called'"
  - "Chicago Convention Articles 7 (cabotage) and 15 (charges)"
  - "Ministry of Civil Aviation, National Civil Aviation Policy 2016: open skies (reciprocal) with SAARC and with countries entirely beyond 5,000 km of New Delhi"

youtube:
  title: "Freedoms of the Air Explained (1st to 9th) with Animations | DGCA Air Regulations Ep 3"
  description: |
    All nine freedoms of the air, each one animated on a simple three-country map: overflight, technical stops, 3rd/4th freedom traffic, the 5th freedom "beyond" rights, and the so-called 6th to 9th freedoms including cabotage. Plus the two Chicago agreements (Transit vs Transport), bilateral air services agreements, and India's NCAP 2016 open-skies rule.
  key_facts:
    - "1st: overfly · 2nd: land for non-traffic purposes (Transit Agreement = 1st + 2nd)"
    - "3rd: home → abroad · 4th: abroad → home · 5th: between two foreign States on a service to/from home (Transport Agreement = 1st–5th)"
    - "6th–9th are 'so-called' freedoms; 8th = consecutive cabotage, 9th = stand-alone cabotage"
    - "Most traffic rights come from bilateral air services agreements"
    - "Art 15: no charge solely for the right of transit, entry or exit (air navigation service charges still apply)"
    - "NCAP 2016: open skies, reciprocal, with SAARC countries and countries entirely beyond 5,000 km of New Delhi"
  tags: [freedoms of the air, DGCA, air regulations, fifth freedom, cabotage, Chicago Convention, CPL, ATPL, pilot training India, aviation law]
  hashtags: ["#DGCA", "#AirRegulations", "#FreedomsOfTheAir", "#CPL", "#PilotTraining", "#Aviation"]

