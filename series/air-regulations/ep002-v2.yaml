youtube:
  title: "Chicago Convention Articles for DGCA: Cabotage, State Aircraft, Article 29 Documents | Air Regulations Ep 2"
  description: |
    The Chicago Convention articles that DGCA asks again and again: state vs civil aircraft (Art 3), the ban on using weapons against civil aircraft (Art 3 bis), scheduled vs non-scheduled flights (Arts 5 & 6), cabotage (Art 7), drones (Art 8), prohibited areas (Art 9), nationality and registration (Arts 17–20), the seven documents every aircraft must carry (Art 29), licences and certificates (Arts 30–33), and the fine print: Arts 16, 25, 26, 35, 36, 83 bis, 90 and 96.
  key_facts:
    - "Art 3: Convention applies to civil aircraft only; military, customs and police aircraft are state aircraft"
    - "Art 3 bis: no weapons against civil aircraft in flight (adopted 1984, in force 1 Oct 1998)"
    - "Art 5: non-scheduled flights may overfly / make non-traffic stops without prior permission; Art 6: scheduled services need permission"
    - "Art 7: cabotage, a State may refuse foreign carriers domestic traffic"
    - "Art 8: pilotless aircraft need special authorization"
    - "Art 17: aircraft have the nationality of the State of registry; Art 18: no dual registration"
    - "Art 29: 7 documents (registration, airworthiness, crew licences, journey log, radio licence, passenger list, cargo manifest)"
    - "Art 32(b): a State may refuse to recognize licences granted to its own nationals by another State"
    - "Art 83 bis: transfer of functions from the State of registry to the State of the operator (in force 20 June 1997)"
    - "Art 90: Annexes adopted by two-thirds of the Council; effective after 3 months unless a majority of States disapprove"
  tags: [DGCA, Air Regulations, Chicago Convention articles, cabotage, Article 29, CPL, ATPL, ICAO, aviation law, pilot training India]
  hashtags: ["#DGCA", "#AirRegulations", "#CPL", "#PilotTraining", "#ICAO", "#Aviation"]

