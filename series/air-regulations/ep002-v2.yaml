    Why can't a foreign airline sell you a Delhi → Mumbai ticket? ✈️ It's called cabotage: Article 7 of the Chicago Convention.
    Full lesson on YouTube: Runway To Cockpit · Air Regulations Ep 2
    #DGCA #pilottraining #aviation #CPL #airregulations #cabotage
  scenes:
    - type: rhook
