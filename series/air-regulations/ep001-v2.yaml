scenes:
  # ───────────────────────── HOOK
  - id: hook
    type: airportmap
    say: >-
      Land in Kochi. {{0}}Land in London. Land in Tokyo. {{1}}The runway numbers look the same. {{2}}The white piano keys
      look the same. {{3}}Even the lights that guide you down look the same. [[pause 0.3]] {{4}}That is not luck.
    data:
      kicker: "Kochi · London · Tokyo"
      title: "Why does every runway look the *same*?"
      legend: false
      plane: {cue: 1, speed: 0.85}
      callouts:
        - {n: 1, label: "Runway designator", sub: "*09* = magnetic heading ≈ 090°", at: designator, cue: 1, zoom: 3.0, rot: -78}
        - {n: 2, label: "Threshold markings", sub: "The “piano keys”: the runway starts here", at: threshold, cue: 2, zoom: 2.8, rot: -74}
        - {n: 3, label: "PAPI lights", sub: "2 red + 2 white = on the glide path", at: papi, cue: 3, zoom: 3.0, rot: -82}
        - {overview: true, cue: 4}

  - id: rulebook
    type: kinetic
    say: >-
      Somebody wrote {{0}}one rulebook for the whole sky. {{1}}And in the next ten minutes, you'll know exactly who.
    data:
      tone: accent
      mode: stack
      lines:
        - {t: "*One* rulebook.", cue: 0}
        - {t: "The *whole* sky.", cue: 0, size: 110, delay: 14}
        - {t: "Who wrote it?", cue: 1, size: 84}

  - id: title
    type: title3d
    say: >-
      Air Regulations, episode one. {{0}}Who writes the rules of the sky?
    data:
      title: "Who Writes the *Rules* of the Sky?"
      sub: "ICAO, the Chicago Convention & India's aviation law"
      shot: cruise
      view: front

  - id: roadmap
    type: kinetic
    say: >-
      Here's the plan. {{0}}One treaty. {{1}}One United Nations agency. {{2}}And one chain of law that runs all the way down
      to your DGCA exam.
    data:
      kicker: In this lesson
      mode: stack
      size: 92
