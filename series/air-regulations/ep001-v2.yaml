        - {n: 5, label: Units of Measurement}
        - {n: 6, label: Operation of Aircraft}
        - {n: 7, label: Nationality & Registration Marks}
        - {n: 8, label: Airworthiness}
        - {n: 9, label: Facilitation}
        - {n: 10, label: Aeronautical Telecommunications}
        - {n: 11, label: Air Traffic Services}
        - {n: 12, label: Search and Rescue}
        - {n: 13, label: Accident Investigation}
        - {n: 14, label: Aerodromes}
        - {n: 15, label: Aeronautical Information Services}
        - {n: 16, label: Environmental Protection}
        - {n: 17, label: Security}
        - {n: 18, label: Dangerous Goods}
        - {n: 19, label: Safety Management}

  - id: annex14
    type: airportmap
    say: >-
      {{0}}Annex Fourteen is why a pilot from Kochi can land in London with no surprises: {{1}}the same holding lines,
      {{2}}the same edge lights, {{3}}the same markings — everywhere on the planet.
    data:
      kicker: "ICAO Annex 14 · worldwide"
      title: "Annex 14 = *Aerodromes*"
      legend: false
      rot: -4
      callouts:
        - {n: 1, label: "Holding position", sub: "Stop here unless cleared onto the runway", at: holding-position, cue: 1, zoom: 3.2, rot: -76}
        - {n: 2, label: "Runway edge lights", sub: "Outline the runway at night and in low visibility", at: edge-lights, cue: 2, zoom: 2.6, rot: -82}
        - {overview: true, cue: 3}

  - id: remember-annexes
    type: examtip
    say: >-
      {{0}}Here's a way to remember those four Annexes. {{1}}One: the pilot. {{2}}Two: the rules. {{3}}Six: the
      aeroplane. {{4}}Eleven: the controller.
    data:
      variant: remember
      big: "1 · 2 · 6 · 11"
      bigCue: 0
      lines:
        - "Annex 1 → the *pilot* (licences)"
        - "Annex 2 → the *rules* of the air"
        - "Annex 6 → the *aeroplane* in operation"
        - "Annex 11 → the *controller* (ATS)"
      lineCues: [1, 2, 3, 4]

  - id: pans
    type: examtip
    say: >-
      {{0}}Key point: under the Annexes sit the PANS — Procedures for Air Navigation Services, the detailed how-to.
      {{1}}PANS-ATM is {Doc 4444.|Doc forty-four forty-four.} {{2}}{PANS-OPS|Pans ops} is {Doc 8168.|Doc eighty-one
      sixty-eight.} These two numbers come up again and again.
    data:
      variant: key
      big: "PANS = the detailed *procedures*"
      bigCue: 0
      lines: ["PANS-ATM → *Doc 4444*", "PANS-OPS → *Doc 8168*"]
      lineCues: [1, 2]

  # ───────────────────────── CHAPTER 3
  - id: ch3
    type: chapter
    say: >-
      Chapter three. {{0}}From Chicago to your DGCA exam.
    data:
      n: 3
      title: "From Chicago to your *DGCA exam*"
      bg3d: {shot: takeoff, view: follow, shift: 0.3}

  - id: ladder
    type: ladder
    say: >-
      Here's the chain of law in India. {{0}}At the top: the Chicago Convention and its Annexes. {{1}}Parliament turns
      them into law with the Bharatiya Vayuyan Adhiniyam, {2024.|twenty twenty-four.} {{2}}The Central Government makes
      Rules under that Act. {{3}}DGCA issues the Civil Aviation Requirements — the CARs. {{4}}And the Airports Authority
      of India publishes the AIP, AICs and NOTAMs.
    data:
      kicker: The chain of law
      title: "Who makes which rule?"
      tiers:
        - {label: "Chicago Convention + Annexes", who: ICAO}
        - {label: "Bharatiya Vayuyan Adhiniyam 2024", who: Parliament}
        - {label: "Rules (e.g. Aircraft Rules 1937)", who: Central Govt}
        - {label: "CARs: Civil Aviation Requirements", who: DGCA}
        - {label: "AIP · AIC · NOTAM", who: AAI}

  - id: bva
    type: split
    say: >-
      The Act itself: {{0}}Act number sixteen of {2024,|twenty twenty-four,} {{1}}in force from {1 January 2025.|the first
      of January, twenty twenty-five.} {{2}}It replaced the Aircraft Act of {1934|nineteen thirty-four} — after ninety
      years. {{3}}Section three sets up DGCA, section five BCAS, section seven the AAIB, {{4}}and section eleven lets the
      government make rules to implement the Chicago Convention.
    data:
      visual: {shot: takeoff, view: spotter}
      side: left
      tag: "Bharatiya Vayuyan Adhiniyam 2024"
      kicker: India's aviation Act
      title: "The *BVA* in five facts"
      items:
        - {icon: law, t: "Act No. 16 of 2024"}
        - {icon: calendar, t: "In force 1 January 2025"}
        - {icon: clock, t: "Replaced the Aircraft Act 1934"}
        - {icon: hierarchy, t: "Sec 3 DGCA · Sec 5 BCAS · Sec 7 AAIB"}
        - {icon: globe, t: "Sec 11: rules to implement the Convention"}

  - id: trap-rules
    type: examtip
    say: >-
      {{0}}Exam trap number two. If the old Act is gone, are the Aircraft Rules of {1937|nineteen thirty-seven} dead?
      {{1}}No! Section forty-three keeps them working until the new rules are published. {{2}}In October, the government
      told the Supreme Court the new rules were approved and would be published within weeks — so know both names.
    data:
      variant: trap
      q: "Old Act repealed — are the *Aircraft Rules 1937* dead?"
      wrong: "Yes, they lapsed"
      wrongCue: 0
      right: "No — Section 43 keeps them alive"
      rightCue: 1
      sub: "Oct 2026: new rules approved, publication due · know both names"
      subCue: 2

  - id: who
    type: org
    say: >-
      {{0}}Who's who under the Ministry of Civil Aviation: {{1}}DGCA, the safety regulator — licences, airworthiness, the
      CARs. {{2}}BCAS, aviation security. {{3}}AAIB, accident investigation. {{4}}And AAI, which runs airports and air
      navigation services.
    data:
      kicker: "Who's who"
      title: "Under the Ministry of Civil Aviation"
      root: {label: "Ministry of Civil Aviation", icon: ministry}
      nodes:
