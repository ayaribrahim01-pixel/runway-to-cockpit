  # ───────────────────────── CHAPTER 1
  - id: ch1
    type: chapter
    say: >-
      Chapter one. {{0}}How the sky got its rules.
    data:
      n: 1
      title: "How the sky got its *rules*"
      bg3d: {shot: cruise, view: rear, shift: 0.3}

  - id: history
    type: whiteboard
    say: >-
      {{0}}{1903:|Nineteen-oh-three:} the Wright brothers fly. {{1}}Within sixteen years, aircraft are crossing borders —
      so in {1919,|nineteen-nineteen,} the Paris Convention writes the first international air law. {{2}}{1929:|Nineteen
      twenty-nine:} the Warsaw Convention sets the rules on airline liability. {{3}}Then, in the middle of World War Two,
      delegates from fifty-four nations meet in Chicago.
    data:
      kicker: History
      title: "How air law *grew up*"
      drawing: wright
      drawingAt: {x: 640, y: 190, s: 0.9}
      nodes:
        - {id: a, label: "1903", sub: "First powered flight", x: 150, y: 560, w: 330, h: 130, cue: 0}
        - {id: b, label: "1919", sub: "Paris Convention", x: 570, y: 560, w: 330, h: 130, cue: 1}
        - {id: c, label: "1929", sub: "Warsaw: airline liability", x: 990, y: 560, w: 330, h: 130, cue: 2}
        - {id: d, label: "1944", sub: "Chicago Convention", x: 1410, y: 560, w: 330, h: 130, cue: 3, color: "#EE6A1A"}
      edges:
        - {from: a, to: b, cue: 1}
        - {from: b, to: c, cue: 2}
        - {from: c, to: d, cue: 3}
      notes:
        - {x: 1400, y: 728, text: "…during World War II", cue: 3, size: 32}

  - id: signed
    type: count
    say: >-
      {{0}}Fifty-two of those States signed the Convention on {7 December 1944.|the seventh of December, nineteen
      forty-four.}
    data:
      kicker: The Chicago Convention
      value: 52
      cue: 0
      countFrames: 42
      label: "States *signed* in Chicago"
      sub: "54 attended · signed 7 December 1944"
      dots: 52
      dotsLabel: "1 dot = 1 signatory State"

  - id: article1
    type: doc
    say: >-
      Its official name: {{0}}the Convention on International Civil Aviation — ninety-six articles. {{1}}And the article
      every examiner loves is Article One: {{2}}every State has complete and exclusive sovereignty over the airspace above
      its territory. {{3}}It came into force on {4 April 1947.|the fourth of April, nineteen forty-seven.}
    data:
      kicker: "Chicago Convention · 96 Articles"
      title: "*Article 1* is the famous one"
      sub: "Complete and exclusive sovereignty"
      header: Convention on International Civil Aviation
      headerSub: Signed at Chicago on 7 December 1944
      lines:
        - "# Part I · Air Navigation"
        - "# Article 1 · Sovereignty"
        - "The contracting States recognize that every"
        - "State has complete and exclusive sovereignty"
        - "over the airspace above its territory."
        - "# Article 2 · Territory"
        - "The territory of a State shall be deemed to be"
        - "the land areas and territorial waters adjacent"
      hl: {line: 3, cue: 2}
      zoom: {cue: 2, scale: 1.32}
      stamp: {text: "In force · 4 Apr 1947", cue: 3}

  - id: dyk-day
    type: examtip
    say: >-
      {{0}}Quiz bonus: the signing date, {7 December,|the seventh of December,} is now celebrated every year as
      International Civil Aviation Day.
    data:
      variant: dyk
      big: "7 December"
      bigCue: 0
      lines: ["*International Civil Aviation Day*", "The Chicago Convention's birthday"]
      lineCues: [0, 0]

  - id: sovereignty
    type: airspace3d
    say: >-
      So what counts as a State's territory? {{0}}Start with the land. {{1}}Add the territorial sea — for India,
      {{2}}twelve nautical miles out from the baseline along the coast. {{3}}All the airspace above both is sovereign.
      [[pause 0.2]] {{4}}Beyond that lie the high seas. Nobody owns that sky — and Article Twelve says the ICAO Rules of the
      Air apply there.
    data:
      kicker: "Articles 1, 2 & 12"
      title: "Who owns the *sky*?"

  - id: permission
    type: kinetic
    say: >-
      So sovereign means one simple thing: {{0}}no foreign aircraft enters without permission.
    data:
      tone: accent
      mode: stack
      lines:
        - "Sovereign airspace"
        - {t: "= *permission* to enter", cue: 0}

  # ───────────────────────── CHAPTER 2
  - id: ch2
    type: chapter
    say: >-
      Chapter two. {{0}}ICAO, the referee of the sky.
    data:
      n: 2
      title: "ICAO: the *referee* of the sky"

  - id: icao
    type: globe
    say: >-
      The Convention also created an organisation to run it: {{0}}ICAO — the International Civil Aviation Organization.
      {{1}}It's a specialised agency of the United Nations, {{2}}with its headquarters in Montreal, Canada. {{3}}And until
      enough States had ratified, a provisional version — PICAO — did the job from {1945.|nineteen forty-five.}
    data:
      kicker: ICAO
      title: "The UN agency for *aviation*"
      notes:
        - {icon: world, text: "UN specialised agency", sub: "Born 4 April 1947", cue: 1}
        - {icon: pin, text: "HQ: *Montréal*, Canada", sub: "Not Chicago — a classic trap", cue: 2}
        - {icon: clock, text: "*PICAO* 1945–47", sub: "Provisional ICAO, until the Convention came into force", cue: 3}
      globe:
        start: {lon: -30, lat: 28}
        focus:
          - {cue: 2, lon: -73.6, lat: 38}
        markers:
          - {lat: 45.50, lon: -73.57, label: "Montréal", cue: 2, big: true}

  - id: trap-iata
    type: examtip
    say: >-
      {{0}}Don't mix it up with IATA. {{1}}ICAO is made of governments. IATA is the airlines' own trade association.
    data:
      variant: trap
      q: "ICAO or IATA: which one is made of *governments*?"
      wrong: "IATA"
      wrongCue: 0
      right: "ICAO — States, under the UN"
      rightCue: 1
      sub: "IATA = the airlines' trade association"
      subCue: 1

  - id: members
    type: count
    say: >-
      {{0}}Today, ICAO has one hundred and ninety-three member States. {{1}}India ratified the Convention on {1 March
      1947|the first of March, nineteen forty-seven} — a month before it even came into force.
    data:
      kicker: ICAO today
      value: 193
      cue: 0
      countFrames: 46
      label: "Member *States*"
      sub: "India ratified on *1 March 1947*"
      dots: 193
      dotsLabel: "1 dot = 1 Member State"

  - id: languages
    type: examtip
    say: >-
      {{0}}Did you know? ICAO works in six official languages: {{1}}Arabic, Chinese, English, French, Russian and Spanish.
    data:
      variant: dyk
      big: "6 official languages"
      bigCue: 0
      lines: ["Arabic · Chinese · English", "French · Russian · Spanish"]
      lineCues: [1, 1]

  - id: regions
    type: globe
    say: >-
      ICAO also runs seven regional offices around the world. {{0}}For India, the one that matters is the Asia and Pacific
