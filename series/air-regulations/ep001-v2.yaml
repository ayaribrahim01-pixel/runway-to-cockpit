youtube:
  title: "Who Writes the Rules of the Sky? ICAO & the Chicago Convention | DGCA Air Regulations Ep 1"
  description: |
    Why does every runway on Earth look the same? Because one treaty — signed in Chicago in 1944 — wrote the rules of the sky. In this first lesson of the DGCA Air Regulations series we cover the Chicago Convention, Article 1 sovereignty, ICAO and its bodies (Council now 40 States), SARPs, the 19 Annexes, PANS documents, and India's chain of aviation law under the Bharatiya Vayuyan Adhiniyam 2024.
  key_facts:
    - "Chicago Convention signed 7 Dec 1944 by 52 States (54 attended); in force 4 April 1947; 96 Articles"
    - "Article 1: complete and exclusive sovereignty over the airspace above a State's territory"
    - "ICAO: UN specialised agency, HQ Montréal, 193 Member States"
    - "ICAO Council: 40 members since 12 June 2026 (4 new seats elected 19–20 Nov 2026)"
    - "Standards = 'shall'; Recommended Practices = 'should'; differences notified under Article 38 (AIP GEN 1.7)"
    - "PANS-ATM = Doc 4444; PANS-OPS = Doc 8168"
    - "BVA 2024 in force 1 Jan 2025; Sec 3 DGCA, Sec 5 BCAS, Sec 7 AAIB, Sec 11 rules to implement the Convention; Sec 43 saves the Aircraft Rules 1937"
  tags: [DGCA, Air Regulations, CPL, ATPL, ICAO, Chicago Convention, pilot training India, DGCA exam, EASA air law, UK CAA air law, aviation law]
  hashtags: ["#DGCA", "#AirRegulations", "#CPL", "#PilotTraining", "#ICAO", "#Aviation"]

