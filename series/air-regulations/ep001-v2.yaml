        - {label: BCAS, full: "Bureau of Civil Aviation Security", sub: "aviation security", icon: security}
        - {label: AAIB, full: "Aircraft Accident Investigation Bureau", sub: "accident investigation", icon: search}
        - {label: AAI, full: "Airports Authority of India", sub: "airports + air navigation", icon: tower}

  - id: easa
    type: examtip
    say: >-
      {{0}}Studying for EASA or the UK CAA? Same Chicago foundation. {{1}}In Europe, EASA writes common rules for its
      member States. {{2}}In Britain, the UK CAA regulates under the Air Navigation Order. {{3}}So the ICAO part of this
      lesson is identical for you.
    data:
      variant: easa
      big: "Same ICAO *foundation*"
      bigCue: 0
      lines: ["*EASA*: common rules for EU member States", "*UK CAA*: the Air Navigation Order", "ICAO content = identical for every exam"]
      lineCues: [1, 2, 3]

  # ───────────────────────── QUIZ + RECAP
  - id: quiz1
    type: quiz
    say: >-
      Quick check. {{0}}Which Article gives every State complete and exclusive sovereignty over its airspace? {{1}}Think
      about it. [[pause 3]] {{2}}Article One. Article Two only defines what the territory is.
    data:
      kicker: Quick check
      n: 1
      of: 3
      q: "Which Article gives every State *complete and exclusive sovereignty* over its airspace?"
      options: ["Article 1", "Article 2", "Article 12", "Article 38"]
      answer: 0
      explain: "Art. 2 defines territory · Art. 12 rules of the air · Art. 38 differences"

  - id: quiz2
    type: quiz
