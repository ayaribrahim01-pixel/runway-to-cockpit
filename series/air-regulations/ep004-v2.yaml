youtube:
  title: "Air Law Conventions for DGCA: Warsaw, Tokyo, Hague, Montreal, Cape Town | DGCA Air Regulations Ep 4"
  description: |
    Every air law convention DGCA asks, sorted by the problem it solves: Paris 1919, Warsaw 1929 and Montreal 1999 (who pays when something goes wrong), Rome 1952 (damage on the ground), Tokyo 1963, Hague 1970, Montreal 1971, the 1988 Airports Protocol and Beijing 2010 (crimes against aviation), and Cape Town 2001 (financing aircraft). Plus the Indian Acts that put them into law.
  key_facts:
    - "Paris 1919: first air law treaty, airspace sovereignty, created ICAN"
    - "Warsaw 1929: carrier liability for international carriage; Hague Protocol 1955 doubled the passenger limit"
    - "Montreal 1999: replaced the Warsaw system; in force 4 Nov 2003; India acceded 2009 (Carriage by Air Act 1972, amended 2009)"
    - "Montreal 1999 limits from 28 Dec 2024: 151,880 SDR death/injury, 6,303 delay, 1,519 baggage, 26 SDR/kg cargo"
    - "Rome 1952: damage by foreign aircraft to third parties on the surface"
    - "Tokyo 1963: offences on board; State of registration has jurisdiction; commander may restrain, disembark, deliver"
    - "Hague 1970: unlawful seizure (hijacking); Montreal 1971: sabotage and acts against safety; Montreal 1988 Protocol: airports"
    - "Beijing 2010: aircraft used as a weapon; India's Anti-Hijacking Act 2016 gives effect to Hague + Beijing Protocol"
    - "Cape Town 2001: international interests in aircraft; India's Act 17 of 2025 in force 1 May 2025"
  tags: [DGCA, Air Regulations, air law conventions, Warsaw Convention, Montreal Convention 1999, Tokyo Convention, Hague Convention, Cape Town Convention, CPL, ATPL, ICAO, pilot training India]
  hashtags: ["#DGCA", "#AirRegulations", "#CPL", "#PilotTraining", "#AviationLaw", "#Aviation"]

